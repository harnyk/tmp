name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/alice-platformer-game-j1aceb"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Разрешаем один параллельный деплой, не отменяя уже запущенный
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # включить Pages, если ещё не включён

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'          # сайт лежит в корне (index.html)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
