<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Алиса и роутеры</title>
<meta name="description" content="Мобильный веб-платформер: Алиса Селезнёва идёт по бесконечному больничному коридору и собирает Wi-Fi роутеры.">
<style>
  :root{
    --bg:#0e1116;
    --hud:#e8f1ff;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:var(--bg); overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none;
    touch-action:none;
    overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  #game{ position:fixed; inset:0; }
  /* маленькая подсказка на первом экране, гасится по первому касанию */
  #hint{
    position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
    color:#9fb2cc; font-size:13px; letter-spacing:.2px;
    background:rgba(10,14,20,.55); padding:6px 12px; border-radius:999px;
    pointer-events:none; transition:opacity .4s ease; z-index:5;
  }
  #hint.hide{ opacity:0; }
</style>
</head>
<body>
  <div id="game"></div>
  <div id="hint">свайп ← → идти (держи) · свайп ↑ — прыжок · собирай роутеры</div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script>
  "use strict";

  // ===== Палитра больничного коридора =====
  const COLORS = {
    wallTop:    0xdfe7ea,   // верх стены
    wallBottom: 0xcdd7db,   // низ стены
    bumper:     0x2f7d5b,   // зелёная полоса-отбойник (чтобы каталками не царапать)
    bumperEdge: 0x1f5a40,
    floor:      0xb9b0a2,   // линолеум
    floorLine:  0x9a9184,
    ceiling:    0xe9eef0,
    lightOn:    0xfff6cf,
    door:       0xb7c4cf,
    doorDark:   0x7f8f9c,
    elevator:   0x8892a0,
    gurney:     0xeef3f6,
    gurneyPad:  0x5a86c9,
    steel:      0xc7cfd6,
    skin:       0xf3c9a3,
    hair:       0x6b4a34,
    ink:        0x22303a,
    router:     0x2a2f36,
    routerLed:  0x39d98a,
    wifi:       0x39d98a,
  };

  const GROUND_H = 90;       // высота пола от низа
  const SEG_W = 900;         // ширина одного сегмента коридора
  const WORLD_H = 640;       // «дизайнерская» высота сцены

  // Абсурдистские плакаты на стенах (текст — как заказан, включая «СИСТРА»)
  // [заголовок (крупно), подпись (сильно мельче)]
  const POSTERS = [
    ["БОЛЕЙТЕ!", "умирайте!"],
    ["ПЛАН/ФАКТ", "0 / 0"],
    ["СИФИЛИС", "не приговор"],
    ["СИСТРА!", "утку!!!"],
    ["ПРОСНИСЬ", "алё"],
    ["NO EXIT", "turn back"],
    ["РЕМОНТ", "часов"],
    ["СИГНАЛ", "контроль"],
    ["КОНЕЦ", "операции"],
    ["ОВОЩИ", "сигареты"],
    ["БОГ?", "а нет."],
    ["ЗАНЯТО", "не расстраивайся"],
  ];
  const POSTER_PAPER  = [0xf2e9d0, 0xeadbb6, 0xe8d6e2, 0xd9e7da, 0xf3dad2, 0xdfe6ef];
  const POSTER_ACCENT = [0xc0392b, 0x2f7d5b, 0x2a5f8f, 0xb8860b, 0x7d3c98, 0x2a2f36];

  // ===== Сцена =====
  class Corridor extends Phaser.Scene {
    constructor(){ super("corridor"); }

    preload(){
      // Слот для «прифотошопленной» головы АС.
      // Положи прозрачный PNG в assets/head.png — он подставится вместо плейсхолдера.
      this.headLoaded = false;
      this.kobraLoaded = false;
      this.load.image("head", "assets/head.png");
      this.load.image("kobra", "assets/kobra.png");   // лицо Кобры Орват (Дарья Верещагина)
      this.load.on("filecomplete-image-head", () => { this.headLoaded = true; });
      this.load.on("filecomplete-image-kobra", () => { this.kobraLoaded = true; });
    }

    create(){
      const H = this.scale.gameSize.height;
      this.groundY = H - GROUND_H;

      // цвет-«рамки» под нижние поля телефонов
      this.cameras.main.setBackgroundColor("#0e1116");

      this.makeTextures();

      // бесконечный мир по X
      this.physics.world.setBounds(-Infinity, 0, Infinity, H);

      // --- фон-коридор: пул сегментов, переиспользуется ---
      this.bgLayer = this.add.container(0, 0).setDepth(0);
      this.segments = [];         // {container, x}
      this.segCount = 5;
      for (let i = 0; i < this.segCount; i++){
        const c = this.add.container(0, 0);
        this.bgLayer.add(c);
        this.segments.push({ container: c, index: i - 1, built: false });
      }

      // --- каталки (препятствия) ---
      this.gurneys = this.physics.add.staticGroup();
      // --- роутеры (коллектиблы) ---
      this.routers = this.add.group();
      this.routerBodies = this.physics.add.group({ allowGravity:false, immovable:true });

      // --- пол (невидимая коллизия во всю длину, двигаем за игроком) ---
      this.floorBody = this.add.rectangle(0, this.groundY + GROUND_H/2, SEG_W*this.segCount, GROUND_H, 0x000000, 0);
      this.physics.add.existing(this.floorBody, true);

      // --- Алиса ---
      this.alice = this.physics.add.sprite(200, this.groundY - 80, "alice");
      this.alice.setOrigin(0.5, 1);
      this.alice.body.setSize(46, 118).setOffset(this.alice.width/2 - 23, this.alice.height - 118);
      this.alice.setCollideWorldBounds(false);
      this.alice.setDepth(6);

      this.physics.add.collider(this.alice, this.floorBody);
      this.physics.add.collider(this.alice, this.gurneys);
      this.physics.add.overlap(this.alice, this.routerBodies, this.collect, null, this);

      // камера следит только по горизонтали; пол всегда прижат к низу экрана
      // (см. смещение scrollX в update)

      // world-строитель
      this.builtUpTo = -SEG_W;    // до какого X застроено декором/объектами
      this.startX = 200;
      this.maxX = this.startX;    // для дистанции

      // рюкзак (0..BAG_MAX) и кумулятивная пирамида (сохраняется)
      this.carried = 0;
      this.pyramid = loadPyramid();
      this.lifts = [];            // порталы-лифты: {x, segIndex, guarded}
      this._dumping = false;

      // рокировка со Злым Близнецом
      this.playingAs = "alice";   // 'alice' | 'kobra'
      this.hellMode = false;
      this.prevX = 200;
      this._armedLift = null;     // кобровский лифт «на прицеле» при полном рюкзаке
      this.gatekeeper = null;     // АС, оставшаяся привратницей

      this.buildInitialWorld();

      // ---- ввод ----
      this.setupInput();

      // ---- HUD ----
      this.buildHUD();
      this.buildHell();

      // gentle: спрятать подсказку по первому вводу
      this._hideHint = () => {
        const h = document.getElementById("hint");
        if (h) h.classList.add("hide");
        this.input.off("pointerdown", this._hideHint);
      };
      this.input.on("pointerdown", this._hideHint);

      // ресайз
      this.scale.on("resize", this.onResize, this);

      // возврат из Апофеозошной (сцена возобновилась)
      this.events.on("resume", this.onResumeAfterDump, this);
    }

    // ---------- Выгрузка в Апофеозошную ----------
    startDump(lift){
      if (this._dumping) return;
      this._dumping = true;
      this.liftPrompt.setVisible(false);
      const hint = document.getElementById("hint"); if (hint) hint.classList.add("hide");
      this.pts = {}; this.jumpReq = null; this.dumpReq = false;   // гасим ввод
      this._armedLift = null;
      this.alice.setVelocity(0, 0);

      // режим Кобры: сброс не в Апофеозошную, а во ТЬМУ
      if (this.playingAs === "kobra"){ this.lastTribute = 0; this.toVoid(); return; }

      // таможня Кобры Орват: забирает 1–2 роутера, потом пропускает в Апофеозошную
      if (lift && lift.guarded && this.carried > 0){
        const tribute = Math.min(this.carried, Phaser.Math.Between(1, 2));
        this.lastTribute = tribute;
        this.tributeThenDump(lift.x, tribute);
      } else {
        this.lastTribute = 0;
        this.toApotheosis();
      }
    }

    // роутеры-«пошлина» летят к Кобре, затем переход
    tributeThenDump(kobraX, n){
      this.blipHiss();
      const a = this.alice;
      const title = this.add.text(this.scale.gameSize.width/2, 40,
        "Кобра Орват берёт своё", {fontFamily:"sans-serif", fontSize:"18px", color:"#dfe8c4",
        backgroundColor:"rgba(20,26,16,0.7)", padding:{x:10,y:6}})
        .setOrigin(0.5).setScrollFactor(0).setDepth(45);
      let done = 0;
      for (let i = 0; i < n; i++){
        const img = this.add.image(a.x + (Math.random()-0.5)*20, a.y - 60, "router")
          .setScale(0.5).setDepth(9);
        this.tweens.add({
          targets: img, x: kobraX, y: this.groundY - 150, angle: 360,
          delay: i*140, duration: 460, ease: "Quad.easeIn",
          onComplete: () => {
            img.destroy();
            this.carried = Math.max(0, this.carried - 1); this.updateHUD();
            done++;
            if (done === n){
              this.time.delayedCall(350, () => { title.destroy(); this.toApotheosis(); });
            }
          }
        });
      }
    }

    toApotheosis(){
      this.blipLift();
      const cam = this.cameras.main;
      cam.fadeOut(500, 0, 0, 0);
      cam.once("camerafadeoutcomplete", () => {
        this.scene.launch("apotheosis", { carried: this.carried });
        this.scene.pause();
      });
    }

    toVoid(){
      this.blipLift();
      const cam = this.cameras.main;
      cam.fadeOut(500, 0, 0, 0);
      cam.once("camerafadeoutcomplete", () => {
        this.scene.launch("apotheosis", { carried: this.carried, void: true });
        this.scene.pause();
      });
    }

    blipHiss(){
      try{
        const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
        if(!this._ac) this._ac = new AC(); const ac=this._ac; if(ac.state==="suspended") ac.resume();
        const dur = 0.5, sr = ac.sampleRate, buf = ac.createBuffer(1, sr*dur, sr), d = buf.getChannelData(0);
        for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 2) * 0.25; // шипение
        const src = ac.createBufferSource(); src.buffer = buf;
        const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 4500; bp.Q.value = 0.8;
        src.connect(bp).connect(ac.destination); src.start();
      }catch(e){}
    }

    onResumeAfterDump(){
      if (!this._dumping) return;
      this._dumping = false;
      this.carried = 0;
      this.pyramid = loadPyramid();     // в режиме Кобры Тьма ничего не сохраняет
      this.updateHUD();
      this.cameras.main.fadeIn(500, 0, 0, 0);
      // сброс во Тьму завершён — Злой Близнец отпускает, возвращаемся к АС
      if (this.playingAs === "kobra") this.swapToAlice();
    }

    // ---------- Рокировка со Злым Близнецом ----------
    buildHell(){
      const W = this.scale.gameSize.width, H = this.scale.gameSize.height;
      this.darkOverlay = this.add.rectangle(0, 0, W, H, 0x000000, 0)
        .setOrigin(0,0).setScrollFactor(0).setDepth(30).setVisible(false);
      this.redOverlay = this.add.rectangle(0, 0, W, H, 0x5a0000, 0)
        .setOrigin(0,0).setScrollFactor(0).setDepth(31).setVisible(false);
      this.flameLayer = this.add.container(0,0).setDepth(5).setVisible(false);
    }

    updateHell(time){
      if (!this.hellMode) return;
      const W = this.scale.gameSize.width, H = this.scale.gameSize.height;
      this.darkOverlay.setSize(W, H).setFillStyle(0x000000, 0.55);
      const pulse = 0.12 + 0.10*(0.5 + 0.5*Math.sin(time*0.006));
      this.redOverlay.setSize(W, H).setFillStyle(0x5a0000, pulse);
      // адское пламя изнутри лифтов
      this.flameLayer.removeAll(true);
      const flick = 0.5 + 0.5*Math.sin(time*0.02);
      for (const l of this.lifts){
        this.flameLayer.add(this.add.ellipse(l.x, this.groundY - 90, 110, 190, 0xff3b00, 0.28 + 0.18*flick));
        this.flameLayer.add(this.add.ellipse(l.x, this.groundY - 70, 70, 150, 0xffb03a, 0.30 + 0.20*flick));
      }
    }

    setHell(on){
      this.hellMode = on;
      this.darkOverlay.setVisible(on);
      this.redOverlay.setVisible(on);
      this.flameLayer.setVisible(on);
      if (!on) this.flameLayer.removeAll(true);
      this.cameras.main.setBackgroundColor(on ? "#120306" : "#0e1116");
    }

    swapToKobra(lift){
      if (this.playingAs === "kobra") return;
      this.playingAs = "kobra";
      // АС остаётся привратницей у этого лифта
      if (this.gatekeeper) this.gatekeeper.destroy();
      this.gatekeeper = this.add.image(lift.x, this.groundY, "alice").setOrigin(0.5, 1).setDepth(6);
      // игрок теперь — Кобра, рюкзак обнуляется (свои 16 сгорели)
      this.carried = 0; this.updateHUD();
      const a = this.alice;
      a.setTexture("kobraSprite");
      a.body.setSize(52, 190).setOffset(a.width/2 - 26, a.height - 190);
      a.setFlipX(false);
      this.setHell(true);
      this.blipLift();
      this.flashTitle("ЗЛОЙ БЛИЗНЕЦ ЗАБРАЛ ТВОЮ ЖИЗНЬ", "#ff5a5a");
    }

    swapToAlice(){
      this.playingAs = "alice";
      if (this.gatekeeper){ this.gatekeeper.destroy(); this.gatekeeper = null; }
      const a = this.alice;
      a.setTexture("alice");
      a.body.setSize(46, 118).setOffset(a.width/2 - 23, a.height - 118);
      this.carried = 0; this.updateHUD();
      this.setHell(false);
    }

    flashTitle(text, color){
      const t = this.add.text(this.scale.gameSize.width/2, this.scale.gameSize.height*0.35, text,
        {fontFamily:"sans-serif", fontStyle:"bold", fontSize:"20px", color:color||"#fff", align:"center",
         backgroundColor:"rgba(0,0,0,0.6)", padding:{x:12,y:8}})
        .setOrigin(0.5).setScrollFactor(0).setDepth(46);
      this.tweens.add({ targets:t, alpha:0, delay:1400, duration:800, onComplete:()=>t.destroy() });
    }

    blipLift(){
      try{
        const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
        if(!this._ac) this._ac = new AC(); const ac=this._ac; if(ac.state==="suspended") ac.resume();
        const o=ac.createOscillator(), g=ac.createGain();
        o.type="sawtooth"; o.frequency.setValueAtTime(440, ac.currentTime);
        o.frequency.exponentialRampToValueAtTime(90, ac.currentTime+0.5);
        g.gain.setValueAtTime(0.06, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+0.55);
        o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+0.56);
      }catch(e){}
    }

    // ---------- Текстуры (всё рисуем кодом) ----------
    makeTextures(){
      this.makeAliceTexture();
      this.makeRouterTexture();
      this.makeKobraTexture();
    }

    // управляемый спрайт Кобры (для рокировки): S-тело + капюшон + лицо
    makeKobraTexture(){
      const w = 120, h = 210, x = w/2;
      const bodyH = 168, A = 26;
      const faceY = h - bodyH - 16;             // локальные координаты (низ = h)

      const g = this.add.graphics();
      // S-тело
      g.lineStyle(14, 0x6f8f5b, 1);
      g.beginPath();
      const N = 26;
      for (let i = 0; i <= N; i++){ const t=i/N; const yy=h - t*bodyH; const xx=x + A*Math.sin(t*Math.PI*2); if(i===0) g.moveTo(xx,yy); else g.lineTo(xx,yy); }
      g.strokePath();
      g.lineStyle(4, 0xcdd9a6, 0.5);
      g.beginPath();
      for (let i = 0; i <= N; i++){ const t=i/N; const yy=h - t*bodyH; const xx=x + A*Math.sin(t*Math.PI*2); if(i===0) g.moveTo(xx,yy); else g.lineTo(xx,yy); }
      g.strokePath();
      // капюшон
      g.fillStyle(0x6f8f5b, 1);  g.fillEllipse(x, faceY + 16, 96, 78);
      g.fillStyle(0x47603a, 1);  g.fillEllipse(x, faceY + 16, 62, 50);
      g.fillStyle(0xdfe8c4, 0.9); g.fillCircle(x-12, faceY+30, 4); g.fillCircle(x+12, faceY+30, 4);

      if (this.kobraLoaded){
        g.generateTexture("kobraBody", w, h); g.destroy();
        const src = this.textures.get("kobra").getSourceImage();
        const targetH = 92, sc = targetH / src.height;
        const face = this.add.image(x, faceY + 2, "kobra").setOrigin(0.5, 0.5).setScale(sc).setVisible(false);
        const rt = this.make.renderTexture({ width:w, height:h }, false);
        rt.draw("kobraBody", 0, 0); rt.draw(face, x, faceY + 2); rt.saveTexture("kobraSprite");
        face.destroy();
      } else {
        // плейсхолдер-лицо (блондинка)
        const R = 22;
        g.fillStyle(0xd9c27a, 1); g.fillCircle(x, faceY, R + 3);
        g.fillStyle(COLORS.skin, 1); g.fillCircle(x, faceY + 2, R - 2);
        g.fillStyle(0xd9c27a, 1); g.fillEllipse(x, faceY - R + 10, R*2, 18);
        g.fillStyle(COLORS.ink, 1); g.fillCircle(x-8, faceY+2, 2.6); g.fillCircle(x+8, faceY+2, 2.6);
        g.lineStyle(2.4, COLORS.ink, 1); g.beginPath(); g.moveTo(x-7, faceY+10); g.lineTo(x+7, faceY+10); g.strokePath();
        g.generateTexture("kobraSprite", w, h); g.destroy();
      }
    }

    makeAliceTexture(){
      // человечек из линий + голова (плейсхолдер, либо assets/head.png если положили)
      const w = 92, h = 150;
      const cx = w/2;
      const headR = 24, headCy = 30;
      const shoulderY = headCy + headR + 12;
      const hipY = h - 46;

      // --- тело из линий (без головы) ---
      const g = this.add.graphics();
      g.lineStyle(6, COLORS.ink, 1);
      g.beginPath(); g.moveTo(cx, headCy + headR - 2); g.lineTo(cx, headCy + headR + 10); g.strokePath();      // шея
      g.beginPath(); g.moveTo(cx, shoulderY); g.lineTo(cx, hipY); g.strokePath();                               // позвоночник
      g.beginPath(); g.moveTo(cx, shoulderY + 6); g.lineTo(cx - 26, shoulderY + 34); g.strokePath();            // руки
      g.beginPath(); g.moveTo(cx, shoulderY + 6); g.lineTo(cx + 26, shoulderY + 30); g.strokePath();
      g.beginPath(); g.moveTo(cx, hipY); g.lineTo(cx - 20, h - 4); g.strokePath();                              // ноги
      g.beginPath(); g.moveTo(cx, hipY); g.lineTo(cx + 20, h - 4); g.strokePath();

      if (this.headLoaded){
        // тело в отдельную текстуру, затем поверх — картинку головы через RenderTexture
        g.generateTexture("alice_body", w, h);
        g.destroy();
        const src = this.textures.get("head").getSourceImage();
        const targetD = headR * 2.6;
        const scale = targetD / Math.max(src.width, src.height);
        const headImg = this.add.image(cx, headCy, "head").setOrigin(0.5).setScale(scale).setVisible(false);
        const rt = this.make.renderTexture({ width:w, height:h }, false);
        rt.draw("alice_body", 0, 0);
        rt.draw(headImg, cx, headCy);
        rt.saveTexture("alice");
        headImg.destroy();
      } else {
        // голова-плейсхолдер: кружок-каре с лицом
        g.fillStyle(COLORS.hair, 1);   g.fillCircle(cx, headCy, headR + 3);
        g.fillStyle(COLORS.skin, 1);   g.fillCircle(cx, headCy + 2, headR - 2);
        g.fillStyle(COLORS.hair, 1);   g.fillEllipse(cx, headCy - headR + 10, headR*2, 20);
        g.fillStyle(COLORS.ink, 1);
        g.fillCircle(cx - 8, headCy + 2, 2.6);
        g.fillCircle(cx + 8, headCy + 2, 2.6);
        g.lineStyle(2.4, COLORS.ink, 1);
        g.beginPath(); g.arc(cx, headCy + 6, 8, 0.15*Math.PI, 0.85*Math.PI, false); g.strokePath();
        g.generateTexture("alice", w, h);
        g.destroy();
      }
    }

    makeRouterTexture(){
      const w = 66, h = 54;
      const g = this.add.graphics();
      // «волны» wi-fi
      g.lineStyle(3, COLORS.wifi, 0.9);
      for (let i = 1; i <= 3; i++){
        g.beginPath();
        g.arc(w/2, h - 12, 8 + i*7, 1.15*Math.PI, 1.85*Math.PI, false);
        g.strokePath();
      }
      // корпус
      g.fillStyle(COLORS.router, 1);
      g.fillRoundedRect(10, h - 22, w - 20, 16, 4);
      // антенны
      g.lineStyle(4, COLORS.router, 1);
      g.beginPath(); g.moveTo(20, h - 22); g.lineTo(12, h - 40); g.strokePath();
      g.beginPath(); g.moveTo(w - 20, h - 22); g.lineTo(w - 12, h - 40); g.strokePath();
      // LED
      g.fillStyle(COLORS.routerLed, 1);
      g.fillCircle(w/2, h - 14, 3);
      g.generateTexture("router", w, h);
      g.destroy();
    }

    // ---------- Построение мира ----------
    buildInitialWorld(){
      for (let i = 0; i < this.segments.length; i++){
        this.buildSegment(this.segments[i], i - 1);
      }
      this.rebuildFloor();
    }

    // индекс сегмента -> его левый X
    segLeftX(index){ return index * SEG_W; }

    buildSegment(seg, index){
      const c = seg.container;
      c.removeAll(true);
      seg.index = index;
      const x0 = this.segLeftX(index);
      const H = this.scale.gameSize.height;
      const gY = this.groundY;

      // задняя стена (градиент двумя прямоугольниками)
      c.add(this.add.rectangle(x0, 0, SEG_W, gY*0.55, COLORS.wallTop).setOrigin(0,0));
      c.add(this.add.rectangle(x0, gY*0.55, SEG_W, gY*0.45, COLORS.wallBottom).setOrigin(0,0));

      // потолок + лампы
      c.add(this.add.rectangle(x0, 0, SEG_W, 26, COLORS.ceiling).setOrigin(0,0));
      for (let lx = 120; lx < SEG_W; lx += 260){
        c.add(this.add.rectangle(x0 + lx, 8, 90, 12, COLORS.lightOn).setOrigin(0,0));
      }

      // полоса-отбойник на стене (горизонтальная), «чтобы каталками не поцарапать»
      const bumperY = gY - 70;
      c.add(this.add.rectangle(x0, bumperY, SEG_W, 16, COLORS.bumper).setOrigin(0,0));
      c.add(this.add.rectangle(x0, bumperY, SEG_W, 3, COLORS.bumperEdge).setOrigin(0,0));
      c.add(this.add.rectangle(x0, bumperY + 13, SEG_W, 3, COLORS.bumperEdge).setOrigin(0,0));

      // пол (линолеум) + стыки плит
      c.add(this.add.rectangle(x0, gY, SEG_W, GROUND_H, COLORS.floor).setOrigin(0,0));
      for (let fx = 0; fx <= SEG_W; fx += 120){
        c.add(this.add.rectangle(x0 + fx, gY, 2, GROUND_H, COLORS.floorLine).setOrigin(0,0));
      }
      c.add(this.add.rectangle(x0, gY, SEG_W, 3, 0xffffff, 0.25).setOrigin(0,0));

      // Двери и лифты — детерминированно от индекса, чтобы при перестройке было стабильно
      const r = mulberry32(1000 + index*97 + 7);
      // дверь(и)
      const doorX = x0 + 120 + Math.floor(r()*120);
      this.drawDoor(c, doorX, gY, r);
      if (r() > 0.5){
        this.drawDoor(c, x0 + 500 + Math.floor(r()*120), gY, r);
      }
      // лифт-портал (иногда) — регистрируем его центр для выгрузки роутеров
      this.lifts = (this.lifts || []).filter(l => l.segIndex !== index);
      if (r() > 0.5){
        const ex = x0 + 300 + Math.floor(r()*80);
        this.drawElevator(c, ex, gY);
        const cx = ex + 60;                 // ew=120 → центр = ex+60
        const guarded = r() < 0.45;         // не у каждого лифта — таможня Кобры Орват
        if (guarded) this.drawKobra(c, cx + 78, gY);
        this.lifts.push({ x: cx, segIndex: index, guarded });
      }

      // плакаты на стене — не часто: ~50% сегментов пустые, иногда 1–2
      const nPost = (r() < 0.5 ? 1 : 0) + (r() < 0.15 ? 1 : 0);
      for (let s = 0; s < nPost; s++){
        const item = POSTERS[Math.floor(r()*POSTERS.length) % POSTERS.length];
        const px = x0 + (s === 0 ? 140 : 540) + Math.floor(r()*240);   // левая/правая половина
        const py = gY - 230 + Math.floor((r()-0.5)*50);
        this.drawPoster(c, px, py, item, r);
      }

      seg.built = true;

      // объекты физики (каталки + роутеры) для этого сегмента — отдельно, тоже детерминированно
      this.populateSegment(index);
    }

    drawDoor(c, x, gY, r){
      const dw = 78, dh = 150;
      const y = gY - dh;
      c.add(this.add.rectangle(x-4, y-4, dw+8, dh+4, COLORS.doorDark).setOrigin(0,0));
      c.add(this.add.rectangle(x, y, dw, dh, COLORS.door).setOrigin(0,0));
      // филёнки
      c.add(this.add.rectangle(x+10, y+12, dw-20, dh*0.5, 0xffffff, 0.18).setOrigin(0,0));
      c.add(this.add.rectangle(x+10, y+12+dh*0.5+6, dw-20, dh*0.35, 0xffffff, 0.12).setOrigin(0,0));
      // ручка
      c.add(this.add.rectangle(x+dw-14, y+dh*0.55, 6, 20, COLORS.doorDark).setOrigin(0,0));
      // табличка «Кабинет N»
      const num = 100 + Math.floor(r()*99);
      c.add(this.add.rectangle(x+16, y-16, 46, 14, 0xffffff, 0.9).setOrigin(0,0));
      c.add(this.add.text(x+18, y-15, "№"+num, {fontFamily:"monospace", fontSize:"11px", color:"#33424c"}).setOrigin(0,0));
    }

    // Кобра Орват — таможня у лифта: застывшее S-тело + капюшон + лицо-плейсхолдер.
    // Выше Алисы; графика условная, в стиле тела АС.
    drawKobra(c, x, gY){
      const green = 0x6f8f5b, greenDk = 0x47603a;
      const bodyH = 168, A = 26;                 // тело выше Алисы (~150)
      const faceY = gY - bodyH - 20;

      // S-тело (застывшее, не извивается) — толстая линия по синусоиде
      const g = this.add.graphics();
      g.lineStyle(14, green, 1);
      g.beginPath();
      const N = 26;
      for (let i = 0; i <= N; i++){
        const t = i/N;
        const yy = gY - t*bodyH;
        const xx = x + A*Math.sin(t*Math.PI*2);
        if (i === 0) g.moveTo(xx, yy); else g.lineTo(xx, yy);
      }
      g.strokePath();
      // брюшко (светлая тонкая линия поверх)
      g.lineStyle(4, 0xcdd9a6, 0.5);
      g.beginPath();
      for (let i = 0; i <= N; i++){
        const t = i/N; const yy = gY - t*bodyH; const xx = x + A*Math.sin(t*Math.PI*2);
        if (i === 0) g.moveTo(xx, yy); else g.lineTo(xx, yy);
      }
      g.strokePath();
      c.add(g);

      // капюшон (раздутый), за лицом
      const hood = this.add.graphics();
      hood.fillStyle(green, 1);      hood.fillEllipse(x, faceY + 16, 96, 78);
      hood.fillStyle(greenDk, 1);    hood.fillEllipse(x, faceY + 16, 62, 50);
      // «очки» кобры — метка на капюшоне
      hood.fillStyle(0xdfe8c4, 0.9);
      hood.fillCircle(x - 12, faceY + 30, 4); hood.fillCircle(x + 12, faceY + 30, 4);
      c.add(hood);

      // лицо: настоящий спрайт assets/kobra.png (Дарья Верещагина), иначе плейсхолдер
      if (this.kobraLoaded){
        const src = this.textures.get("kobra").getSourceImage();
        const targetH = 92;                       // высота головы в капюшоне
        const face = this.add.image(x, faceY + 2, "kobra").setOrigin(0.5, 0.5)
          .setScale(targetH / src.height);
        c.add(face);
      } else {
        const f = this.add.graphics();
        const R = 22;
        f.fillStyle(0xd9c27a, 1); f.fillCircle(x, faceY, R + 3);            // волосы
        f.fillStyle(COLORS.skin, 1); f.fillCircle(x, faceY + 2, R - 2);     // лицо
        f.fillStyle(0xd9c27a, 1); f.fillEllipse(x, faceY - R + 10, R*2, 18);// чёлка
        f.fillStyle(COLORS.ink, 1);
        f.fillCircle(x - 8, faceY + 2, 2.6); f.fillCircle(x + 8, faceY + 2, 2.6);
        f.lineStyle(2.4, COLORS.ink, 1);                                    // строгий ровный рот
        f.beginPath(); f.moveTo(x - 7, faceY + 10); f.lineTo(x + 7, faceY + 10); f.strokePath();
        f.lineStyle(2, 0xc0392b, 1);                                        // раздвоенный язычок
        f.beginPath(); f.moveTo(x, faceY + 12); f.lineTo(x, faceY + 20); f.strokePath();
        f.beginPath(); f.moveTo(x, faceY + 20); f.lineTo(x - 4, faceY + 24); f.strokePath();
        f.beginPath(); f.moveTo(x, faceY + 20); f.lineTo(x + 4, faceY + 24); f.strokePath();
        c.add(f);
      }
    }

    // плакат на стене: бумага + рамка + акцентная полоса + жирный текст, лёгкий наклон
    drawPoster(c, cx, cy, item, r){
      const title = Array.isArray(item) ? item[0] : item;
      const sub   = Array.isArray(item) ? (item[1] || "") : "";
      const paper = POSTER_PAPER[Math.floor(r()*POSTER_PAPER.length) % POSTER_PAPER.length];
      const accent = POSTER_ACCENT[Math.floor(r()*POSTER_ACCENT.length) % POSTER_ACCENT.length];
      const tilt = (r()-0.5) * 0.42;   // ±~12° — заметный разброс наклона

      const g = this.add.container(cx, cy);
      g.rotation = tilt;

      // заголовок — крупно; подпись — сильно мельче
      const t = this.add.text(0, 0, title, {
        fontFamily: "Arial, 'Helvetica Neue', sans-serif",
        fontStyle: "bold", fontSize: "28px", color: "#22282e", align: "center"
      }).setOrigin(0.5, 0);
      const s = sub ? this.add.text(0, 0, sub, {
        fontFamily: "Arial, 'Helvetica Neue', sans-serif",
        fontSize: "12px", color: "#5a4d3c", align: "center"
      }).setOrigin(0.5, 0) : null;

      const gap = 3;
      const contentW = Math.max(t.width, s ? s.width : 0);
      const contentH = t.height + (s ? gap + s.height : 0);
      const padX = 20, padTop = 18, padBot = 14;
      const w = Math.ceil(contentW) + padX*2;
      const h = Math.ceil(contentH) + padTop + padBot;

      const topY = -h/2 + padTop;
      t.setPosition(0, topY);
      if (s) s.setPosition(0, topY + t.height + gap);

      const frame = this.add.rectangle(0, 0, w+8, h+8, 0x2a2f36, 0.85).setOrigin(0.5);
      const sheet = this.add.rectangle(0, 0, w, h, paper, 1).setOrigin(0.5).setStrokeStyle(2, 0x2a2f36, 0.5);
      const bar   = this.add.rectangle(0, -h/2 + 6, w, 8, accent, 1).setOrigin(0.5); // акцентная полоса сверху

      const parts = [frame, sheet, bar, t];
      if (s) parts.push(s);
      g.add(parts);
      c.add(g);
    }

    drawElevator(c, x, gY){
      const ew = 120, eh = 190;
      const y = gY - eh;
      c.add(this.add.rectangle(x-6, y-6, ew+12, eh+6, 0x5b6673).setOrigin(0,0));
      c.add(this.add.rectangle(x, y, ew/2-1, eh, COLORS.elevator).setOrigin(0,0));
      c.add(this.add.rectangle(x+ew/2+1, y, ew/2-1, eh, COLORS.elevator).setOrigin(0,0));
      c.add(this.add.rectangle(x+ew/2-1, y, 2, eh, 0x3d4650).setOrigin(0,0));
      // индикатор этажа
      c.add(this.add.rectangle(x+ew/2-18, y-22, 36, 16, 0x20272e).setOrigin(0,0));
      c.add(this.add.text(x+ew/2-10, y-21, "▲", {fontFamily:"monospace", fontSize:"12px", color:"#ffcf5a"}).setOrigin(0,0));
      // кнопка вызова
      c.add(this.add.circle(x+ew+12, y+eh*0.5, 6, 0x2a2f36).setOrigin(0.5));
      c.add(this.add.circle(x+ew+12, y+eh*0.5, 3, 0x39d98a).setOrigin(0.5));
    }

    // Каталки и роутеры сегмента — создаём один раз на индекс, помечаем segIndex
    populateSegment(index){
      if (!this._populated) this._populated = new Set();
      if (this._populated.has(index)) return;
      this._populated.add(index);

      const x0 = this.segLeftX(index);
      const gY = this.groundY;
      const r = mulberry32(555 + index*131 + 3);

      // не заваливаем стартовый экран препятствиями
      const isStart = (index === 0);

      // 1–2 каталки
      const nG = isStart ? 1 : (1 + (r() > 0.6 ? 1 : 0));
      for (let i = 0; i < nG; i++){
        const gx = x0 + 220 + i*430 + Math.floor(r()*120);
        this.spawnGurney(gx, gY, index);
        // роутер на каталке
        if (r() > 0.35) this.spawnRouter(gx, gY - 118, index);
      }
      // парящие роутеры — на достижимой прыжком высоте (апекс прыжка ~110px)
      const nR = 2 + Math.floor(r()*2);
      for (let i = 0; i < nR; i++){
        const rx = x0 + 120 + i*(SEG_W/(nR+1)) + Math.floor(r()*60);
        const ry = gY - 70 - Math.floor(r()*120);   // gY-70 .. gY-190
        this.spawnRouter(rx, ry, index);
      }
    }

    spawnGurney(x, gY, segIndex){
      const w = 150, h = 74;
      const y = gY - h;
      const g = this.add.container(x, y).setDepth(4);
      g.add(this.add.rectangle(0, 18, w, 20, COLORS.gurneyPad).setOrigin(0,0));        // матрас
      g.add(this.add.rectangle(0, 14, w, 6, 0xffffff, 0.7).setOrigin(0,0));            // простыня
      g.add(this.add.rectangle(0, 34, w, 8, COLORS.steel).setOrigin(0,0));             // рама
      g.add(this.add.rectangle(4, 4, 34, 14, 0xffffff, 0.85).setOrigin(0,0));          // подушка
      g.add(this.add.rectangle(6, 42, 6, 26, COLORS.steel).setOrigin(0,0));            // ножки
      g.add(this.add.rectangle(w-12, 42, 6, 26, COLORS.steel).setOrigin(0,0));
      g.add(this.add.circle(9, 70, 7, 0x2a2f36));                                      // колёса
      g.add(this.add.circle(w-9, 70, 7, 0x2a2f36));
      // ограждение
      g.add(this.add.rectangle(0, 6, 4, 30, COLORS.steel).setOrigin(0,0));
      g.add(this.add.rectangle(w-4, 6, 4, 30, COLORS.steel).setOrigin(0,0));

      // физ-тело каталки (перепрыгиваемое препятствие)
      const body = this.add.rectangle(x + w/2, y + h/2 + 12, w-16, h-24, 0x000000, 0);
      this.gurneys.add(body);
      body.segIndex = segIndex;
      body.gfx = g;
      g.body = body;
    }

    spawnRouter(x, y, segIndex){
      const img = this.add.image(x, y, "router").setDepth(5);
      this.physics.add.existing(img);
      img.body.setAllowGravity(false);
      img.body.setImmovable(true);
      img.segIndex = segIndex;
      img.baseY = y;
      img.phase = Math.random()*Math.PI*2;
      this.routers.add(img);
      this.routerBodies.add(img);
    }

    rebuildFloor(){
      // держим коллайдер пола под текущим окном сегментов
      const minIndex = Math.min(...this.segments.map(s=>s.index));
      const leftX = this.segLeftX(minIndex);
      const totalW = SEG_W * this.segments.length;
      this.floorBody.x = leftX + totalW/2;
      this.floorBody.y = this.groundY + GROUND_H/2;
      this.floorBody.body.updateFromGameObject();
    }

    // ---------- Ввод ----------
    setupInput(){
      this.keys = this.input.keyboard.addKeys({
        left: Phaser.Input.Keyboard.KeyCodes.LEFT,
        right: Phaser.Input.Keyboard.KeyCodes.RIGHT,
        a: Phaser.Input.Keyboard.KeyCodes.A,
        d: Phaser.Input.Keyboard.KeyCodes.D,
        up: Phaser.Input.Keyboard.KeyCodes.UP,
        w: Phaser.Input.Keyboard.KeyCodes.W,
        space: Phaser.Input.Keyboard.KeyCodes.SPACE,
      });
      this.touch = { left:false, right:false };
      this.setupSwipe();
    }

    // ---------- Свайп-управление ----------
    // Ходьба: «свайп-и-держи» — тянешь палец в сторону и держишь.
    // Прыжок: быстрый флик вверх (сохраняет горизонтальное направление).
    setupSwipe(){
      this.input.addPointer(3);       // мультитач: держать направление + флик вверх
      this.pts = {};                  // состояние по каждому указателю
      this.jumpReq = null;            // запрос прыжка от свайпа {dir}
      this.dumpReq = false;           // запрос выгрузки (свайп вниз у лифта)
      this.walkDir = 0;               // текущее направление ходьбы (обновляется в update)
      this.SWIPE_DEAD = 20;           // дедзона по X для старта ходьбы, px
      this.FLICK_VY = -0.6;           // порог скорости вверх, px/ms
      this.FLICK_DY = 30;             // минимальный подъём от старта, px

      this.input.on("pointerdown", (p)=>{
        this.pts[p.id] = { startX:p.x, startY:p.y, lastX:p.x, lastY:p.y, lastT:p.event ? p.event.timeStamp : performance.now(), jumped:false, dumped:false };
      });
      this.input.on("pointermove", (p)=>{
        const s = this.pts[p.id];
        if (!s) return;
        const now = (p.event ? p.event.timeStamp : performance.now());
        const dt = Math.max(1, now - s.lastT);
        const vy = (p.y - s.lastY) / dt;         // <0 — движение вверх
        s.lastX = p.x; s.lastY = p.y; s.lastT = now;
        // флик вверх → прыжок (один раз на жест)
        if (!s.jumped && vy < this.FLICK_VY && (s.startY - p.y) > this.FLICK_DY){
          s.jumped = true;
          const dx = p.x - s.startX;
          const dir = this.walkDir !== 0 ? this.walkDir
                    : (Math.abs(dx) > this.SWIPE_DEAD ? Math.sign(dx) : 0);
          this.jumpReq = { dir };
        }
        // флик вниз → выгрузка у лифта (один раз на жест)
        if (!s.dumped && vy > -this.FLICK_VY && (p.y - s.startY) > this.FLICK_DY){
          s.dumped = true;
          this.dumpReq = true;
        }
      });
      const drop = (p)=>{ delete this.pts[p.id]; };
      this.input.on("pointerup", drop);
      this.input.on("pointerupoutside", drop);
      this.input.on("gameout", ()=>{ this.pts = {}; });
    }

    // направление ходьбы из «активного» указателя (наибольшее смещение по X)
    swipeWalkDir(){
      let best = 0, dir = 0;
      for (const id in this.pts){
        const s = this.pts[id];
        const dx = s.lastX - s.startX;
        if (Math.abs(dx) > this.SWIPE_DEAD && Math.abs(dx) > best){ best = Math.abs(dx); dir = Math.sign(dx); }
      }
      return dir;
    }

    // ---------- HUD ----------
    // Рюкзак — квадрат 4×4 из ячеек: заполняется по мере сбора, полный меняет цвет.
    buildHUD(){
      const x0 = 14, y0 = 14, cell = 13, gap = 3;
      const grid = 4*cell + 3*gap;                 // ~61px
      this.hudBg = this.add.rectangle(8, 8, grid + 150, grid + 12, 0x0e1620, 0.55)
        .setOrigin(0,0).setScrollFactor(0).setDepth(40).setStrokeStyle(1, 0xffffff, 0.12);

      this.bagCells = [];
      for (let i = 0; i < 16; i++){
        const col = i % 4, row = Math.floor(i / 4);       // заполняем снизу вверх (row 3 -> низ)
        const cx = x0 + col*(cell+gap);
        const cy = y0 + (3-row)*(cell+gap);
        const r = this.add.rectangle(cx, cy, cell, cell, 0x2b3a2f, 1)
          .setOrigin(0,0).setScrollFactor(0).setDepth(41).setStrokeStyle(1, 0xffffff, 0.15);
        this.bagCells.push(r);
      }
      this.hudPyramid = this.add.text(x0 + grid + 12, y0 + 4, "", {fontFamily:"monospace", fontSize:"16px", color:"#e6c14b"})
        .setScrollFactor(0).setDepth(41);
      this.hudDist = this.add.text(x0 + grid + 12, y0 + 30, "", {fontFamily:"monospace", fontSize:"13px", color:"#cfe0f5"})
        .setScrollFactor(0).setDepth(41);

      // подсказка у лифта (в мире, над лифтом)
      this.liftPrompt = this.add.text(0, 0, "свайп ↓ — выгрузить", {
        fontFamily:"sans-serif", fontSize:"16px", color:"#ffe08a",
        backgroundColor:"rgba(20,14,8,0.6)", padding:{x:8,y:4}
      }).setOrigin(0.5).setDepth(8).setVisible(false);

      this.updateHUD();
    }

    updateHUD(){
      const full = this.carried >= 16;
      for (let i = 0; i < 16; i++){
        const on = i < this.carried;
        // полный рюкзак — золотой (пора выгружать), иначе зелёный/пусто
        this.bagCells[i].setFillStyle(on ? (full ? 0xe6c14b : 0x39d98a) : 0x2b3a2f, 1);
      }
      this.hudPyramid.setText("🗿 Пирамида: " + this.pyramid);
      const dist = Math.max(0, Math.floor((this.maxX - this.startX)/40));
      this.hudDist.setText("Дист: " + dist + " м · рюкзак " + this.carried + "/16");
    }

    // ---------- Сбор роутера ----------
    collect(alice, router){
      if (!router.active) return;
      if (this.carried >= 16) return;   // рюкзак полон — больше не влезает, надо выгрузить
      this.carried++;
      this.updateHUD();
      this.blip();
      const full = this.carried >= 16;
      const puff = this.add.text(router.x, router.y-6, full ? "ПОЛНО!" : "+1",
        {fontFamily:"monospace", fontSize: full ? "16px" : "18px", color: full ? "#e6c14b" : "#39d98a"})
        .setOrigin(0.5).setDepth(9);
      this.tweens.add({ targets:puff, y:puff.y-40, alpha:0, duration:600, onComplete:()=>puff.destroy() });
      this.routerBodies.remove(router, false, false);
      this.routers.remove(router, false, false);
      router.destroy();
    }

    blip(){
      try{
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        if (!this._ac) this._ac = new AC();
        const ac = this._ac;
        if (ac.state === "suspended") ac.resume();
        const o = ac.createOscillator(), gv = ac.createGain();
        o.type = "square";
        o.frequency.setValueAtTime(660, ac.currentTime);
        o.frequency.exponentialRampToValueAtTime(1180, ac.currentTime+0.08);
        gv.gain.setValueAtTime(0.09, ac.currentTime);
        gv.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+0.14);
        o.connect(gv).connect(ac.destination);
        o.start(); o.stop(ac.currentTime+0.15);
      }catch(e){}
    }

    // ---------- Ресайз / поворот экрана ----------
    onResize(){
      if (!this.segments || !this.alice) return;
      const H = this.scale.gameSize.height;
      this.groundY = H - GROUND_H;

      // сносим динамические объекты и пересобираем сегменты под новую высоту
      this.gurneys.children.iterate((body)=>{ if (body && body.gfx) body.gfx.destroy(); });
      this.gurneys.clear(true, true);            // тела каталок
      this.routerBodies.clear(false, false);     // те же объекты, что и в routers — только очистить группу
      this.routers.clear(true, true);            // уничтожить спрайты роутеров
      this._populated = new Set();
      this.lifts = [];                           // перерегистрируются в buildSegment

      for (const seg of this.segments) this.buildSegment(seg, seg.index);
      this.rebuildFloor();

      // если Алиса оказалась ниже нового пола — поднимем на пол
      if (this.alice.y > this.groundY){ this.alice.y = this.groundY - 5; this.alice.setVelocityY(0); }
    }

    // ---------- Игровой цикл ----------
    update(time, delta){
      const a = this.alice, b = a.body;
      const speed = 260, jump = 560;
      const onGround = b.blocked.down || b.touching.down;

      // направление ходьбы: свайп-и-держи ИЛИ клавиатура
      this.walkDir = this.swipeWalkDir();
      const left  = this.walkDir < 0 || this.keys.left.isDown  || this.keys.a.isDown;
      const right = this.walkDir > 0 || this.keys.right.isDown || this.keys.d.isDown;
      const kbdJump = this.keys.up.isDown || this.keys.w.isDown || this.keys.space.isDown;

      // Голова (assets/head.png) нарисована смотрящей ВЛЕВО, поэтому влево — без флипа,
      // вправо — зеркалим (весь спрайт, голова смотрит по ходу движения).
      if (left && !right){ a.setVelocityX(-speed); a.setFlipX(false); this.facing = -1; }
      else if (right && !left){ a.setVelocityX(speed); a.setFlipX(true); this.facing = 1; }
      else if (onGround){ a.setVelocityX(0); }   // в воздухе без ввода сохраняем импульс (дуга прыжка)

      // прыжок: клавиатура (edge) ИЛИ свайп-флик вверх (this.jumpReq)
      const jumpReq = this.jumpReq; this.jumpReq = null;
      if (onGround){
        if (kbdJump && !this._jumpHeld){ a.setVelocityY(-jump); this.blipJump(); }
        else if (jumpReq){
          a.setVelocityY(-jump); this.blipJump();
          // направленный прыжок из стойки (диагональный флик), если сейчас нет ходьбы
          if (!left && !right && jumpReq.dir !== 0){
            a.setVelocityX(jumpReq.dir * speed);
            a.setFlipX(jumpReq.dir > 0); this.facing = jumpReq.dir;
          }
        }
      }
      this._jumpHeld = kbdJump;

      // портал-лифт: подсказка у ближайшего лифта + выгрузка по свайпу вниз
      const kobraMode = this.playingAs === "kobra";
      const near = this.lifts.find(l => Math.abs(a.x - l.x) < 70);
      this.atLift = !!near && onGround && !this._dumping &&
                    (kobraMode ? this.carried >= 16 : this.carried > 0);
      if (this.liftPrompt){
        if (this.atLift){
          this.liftPrompt.setText(kobraMode ? "свайп ↓ — во ТЬМУ"
                        : (near.guarded ? "свайп ↓ — выгрузить · Кобра берёт пошлину" : "свайп ↓ — выгрузить"));
          this.liftPrompt.setVisible(true).setPosition(near.x, this.groundY - 210);
        } else this.liftPrompt.setVisible(false);
      }
      const dumpReq = this.dumpReq; this.dumpReq = false;
      if (dumpReq && this.atLift) this.startDump(near);

      // РОКИРОВКА: полный (16) рюкзак вошёл в зону кобровского лифта и ушёл, не заплатив
      if (!kobraMode && !this._dumping && this.carried >= 16){
        if (near && near.guarded){
          this._armedLift = near;                       // взяли на прицел
        } else if (this._armedLift && Math.abs(a.x - this._armedLift.x) > 78){
          const l = this._armedLift; this._armedLift = null;
          this.swapToKobra(l);                          // покинула зону, не заплатив → рокировка
        }
      } else {
        this._armedLift = null;
      }
      this.updateHell(time);

      // лёгкое «покачивание» при ходьбе
      if (onGround && Math.abs(b.velocity.x) > 10){
        a.rotation = Math.sin(time*0.02) * 0.05;
      } else {
        a.rotation = Phaser.Math.Linear(a.rotation, 0, 0.2);
      }

      // не даём провалиться если что-то пошло не так
      if (a.y > this.scale.gameSize.height + 400){
        a.setPosition(this.maxX, this.groundY - 120);
        a.setVelocity(0,0);
      }

      // камера: плавно по X, пол прижат к низу (scrollY=0)
      const cam = this.cameras.main;
      const targetX = a.x - this.scale.gameSize.width * 0.4;
      cam.scrollX = Phaser.Math.Linear(cam.scrollX, targetX, 0.12);
      cam.scrollY = 0;

      this.maxX = Math.max(this.maxX, a.x);
      this.prevX = a.x;
      this.updateHUD();

      // покачивание роутеров
      this.routers.children.iterate((r)=>{
        if (r && r.active){ r.y = r.baseY + Math.sin(time*0.004 + r.phase)*6; r.body.updateFromGameObject && r.body.updateFromGameObject(); r.rotation = Math.sin(time*0.003 + r.phase)*0.15; }
      });

      this.recycleWorld();
    }

    blipJump(){
      try{
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        if (!this._ac) this._ac = new AC();
        const ac = this._ac; if (ac.state==="suspended") ac.resume();
        const o = ac.createOscillator(), gv = ac.createGain();
        o.type="triangle"; o.frequency.setValueAtTime(320, ac.currentTime);
        o.frequency.exponentialRampToValueAtTime(520, ac.currentTime+0.12);
        gv.gain.setValueAtTime(0.05, ac.currentTime);
        gv.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+0.16);
        o.connect(gv).connect(ac.destination); o.start(); o.stop(ac.currentTime+0.17);
      }catch(e){}
    }

    // переиспользование фоновых сегментов + подгрузка объектов
    recycleWorld(){
      const camX = this.cameras.main.scrollX;
      const viewW = this.scale.gameSize.width;

      // индекс сегмента, в котором сейчас центр вида
      const centerIdx = Math.floor((camX + viewW/2) / SEG_W);

      // хотим сегменты [centerIdx-2 .. centerIdx+2]
      const want = [];
      for (let d=-2; d<=2; d++) want.push(centerIdx + d);

      const have = this.segments.map(s=>s.index);
      // переназначаем те, что вне окна
      for (const seg of this.segments){
        if (!want.includes(seg.index)){
          // найти нужный индекс, которого ещё нет
          const missing = want.find(i => !this.segments.some(s=>s.index===i));
          if (missing !== undefined){
            this.buildSegment(seg, missing);
          }
        }
      }
      this.rebuildFloor();

      // подчистка объектов далеко за кадром (каталки/роутеры) — удаляем по segIndex вне окна
      const keepMin = centerIdx - 3, keepMax = centerIdx + 3;
      this.gurneys.children.iterate((body)=>{
        if (body && (body.segIndex < keepMin || body.segIndex > keepMax)){
          if (body.gfx) body.gfx.destroy();
          this.gurneys.remove(body, true, true);
          this._populated.delete(body.segIndex);
        }
      });
      this.routers.children.iterate((r)=>{
        if (r && (r.segIndex < keepMin || r.segIndex > keepMax)){
          this.routerBodies.remove(r, false, false);
          this.routers.remove(r, false, false);
          r.destroy();
        }
      });
      // если сегмент был очищен от объектов, но снова в окне — заселить заново
      for (const idx of want){
        if (idx >= keepMin && idx <= keepMax) this.populateSegment(idx);
      }
    }
  }

  // ===== Апофеозошная: пирамида роутеров а-ля «Апофеоз войны» =====
  const PY_CAP = 18;         // максимум видимых рядов пирамиды
  const PY_ITEM = 0.4;       // масштаб роутера в пирамиде
  const PY_DX = 22, PY_ROW = 15;  // шаг между роутерами по X и высота ряда (с нахлёстом)

  class Apotheosis extends Phaser.Scene {
    constructor(){ super("apotheosis"); }

    create(data){
      const W = this.scale.gameSize.width, H = this.scale.gameSize.height;
      this.carried = (data && data.carried) || 0;
      this._returning = false;
      this.canReturn = false;
      this.cameras.main.fadeIn(500, 0, 0, 0);

      if (data && data.void){ this.createVoid(W, H); return; }

      // небо (охра→марево) и выжженная земля
      this.add.rectangle(0, 0, W, H, 0xd9b25a).setOrigin(0,0);
      this.add.rectangle(0, H*0.42, W, H*0.22, 0xce9c46, 0.7).setOrigin(0,0);
      this.groundY = H - 66;
      this.add.rectangle(0, this.groundY, W, H-this.groundY, 0xb08948).setOrigin(0,0);
      this.add.rectangle(0, this.groundY, W, 3, 0x8a6a34).setOrigin(0,0);
      this.add.circle(W*0.8, H*0.2, 42, 0xe8d08a, 0.65);   // тусклое солнце

      this.drawRuin(28, this.groundY);
      this.drawTree(W-64, this.groundY);
      for (let i=0;i<5;i++) this.drawCrow(70 + Math.random()*(W-140), 50 + Math.random()*130);

      // пирамида
      this.pyBaseX = W*0.52;
      this.pyBaseY = this.groundY - 4;
      this.pyBefore = loadPyramid();
      this.pyraLayer = this.add.container(0,0).setDepth(2);
      this.drawPyramid(this.pyBefore);

      // трамплин (доска) над пирамидой + АС на конце
      const apexY = this.apexY(this.pyBefore + this.carried);
      const boardY = apexY - 66;
      const boardX0 = W*0.04, boardX1 = this.pyBaseX + 24;
      this.add.rectangle(boardX0, boardY-2, 14, 44, 0x6b451f).setOrigin(0,0);           // опора
      this.add.rectangle(boardX0, boardY, boardX1-boardX0, 12, 0x9a6633).setOrigin(0,0.5).setDepth(3); // доска
      this.aliceX = boardX1 - 10;
      this.alice = this.add.image(this.aliceX, boardY-2, this.textures.exists("alice") ? "alice":"router")
        .setOrigin(0.5, 1).setDepth(3);

      // заметный плакат-баннер «АПОФЕОЗОШНАЯ» вверху сцены
      this.drawBanner(W/2, 48, "АПОФЕОЗОШНАЯ");
      this.cnt = this.add.text(14, 12, "🗿 " + this.pyBefore, {fontFamily:"monospace", fontSize:"16px", color:"#3a2c14"})
        .setScrollFactor(0).setDepth(5);

      this.canReturn = false;
      this.time.delayedCall(500, () => this.animateDump());
      this.input.on("pointerdown", () => { if (this.canReturn) this.returnToCorridor(); });
      this.input.keyboard.on("keydown", () => { if (this.canReturn) this.returnToCorridor(); });
    }

    // ТЬМА: сброс роутеров в ничто (пирамида не растёт)
    createVoid(W, H){
      this.cameras.main.setBackgroundColor("#020103");
      this.add.rectangle(0, 0, W, H, 0x020103, 1).setOrigin(0,0);
      this.add.text(W/2, H*0.16, "ТЬМА", {fontFamily:"Georgia, serif", fontStyle:"bold",
        fontSize:"40px", color:"#3a0d0d", letterSpacing:6}).setOrigin(0.5);

      const n = this.carried;
      let done = 0;
      if (n === 0){ this.voidFinish(); }
      for (let i = 0; i < n; i++){
        const img = this.add.image(W/2 + (Math.random()-0.5)*W*0.5, -20 - Math.random()*60, "router")
          .setScale(0.5).setTint(0x2a2a30).setDepth(2);
        this.tweens.add({
          targets: img, y: H + 40, angle:(Math.random()-0.5)*220, alpha:0,
          delay: i*80, duration: 900 + Math.random()*400, ease: "Quad.easeIn",
          onComplete: () => { img.destroy(); if (++done === n) this.voidFinish(); }
        });
      }
      this.blipVoid();
      this.input.on("pointerdown", () => { if (this.canReturn) this.returnToCorridor(); });
      this.input.keyboard.on("keydown", () => { if (this.canReturn) this.returnToCorridor(); });
    }

    voidFinish(){
      // пирамида НЕ сохраняется — всё сгорело во Тьме
      const W = this.scale.gameSize.width, H = this.scale.gameSize.height;
      this.add.text(W/2, H*0.52, "они сгинули\nтап — назад", {fontFamily:"sans-serif",
        fontSize:"16px", color:"#8a4a4a", align:"center"}).setOrigin(0.5).setDepth(6);
      this.canReturn = true;
    }

    blipVoid(){
      try{
        const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
        if(!this._ac) this._ac = new AC(); const ac=this._ac; if(ac.state==="suspended") ac.resume();
        const o=ac.createOscillator(), g=ac.createGain();
        o.type="sine"; o.frequency.setValueAtTime(70, ac.currentTime);
        o.frequency.exponentialRampToValueAtTime(28, ac.currentTime+1.2);
        g.gain.setValueAtTime(0.08, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+1.3);
        o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+1.3);
      }catch(e){}
    }

    // число полных рядов пирамиды для count элементов
    rows(count){ return Math.max(0, Math.floor((Math.sqrt(8*count+1)-1)/2)); }
    apexY(count){ return this.pyBaseY - Math.min(this.rows(count), PY_CAP) * PY_ROW; }

    drawPyramid(count){
      this.pyraLayer.removeAll(true);
      const R = Math.min(this.rows(count), PY_CAP);
      let placed = 0;
      const full = R*(R+1)/2;
      let extra = Math.max(0, count - full);   // остаток на неполный верхний ряд
      // ряды снизу (широкие) вверх
      for (let r = 0; r < R; r++){
        const inRow = R - r;                   // низ шире
        const y = this.pyBaseY - r*PY_ROW;
        for (let k = 0; k < inRow; k++){
          const x = this.pyBaseX + (k - (inRow-1)/2)*PY_DX + (Math.random()-0.5)*3;
          this.pyraLayer.add(this.add.image(x, y, "router").setOrigin(0.5,1).setScale(PY_ITEM)
            .setTint(0x4a4a52).setAngle((Math.random()-0.5)*30));
          placed++;
        }
      }
      // неполный верхний ряд
      if (extra > 0 && R < PY_CAP){
        const y = this.pyBaseY - R*PY_ROW;
        for (let k = 0; k < Math.min(extra, R+1); k++){
          const x = this.pyBaseX + (k - (Math.min(extra,R+1)-1)/2)*PY_DX;
          this.pyraLayer.add(this.add.image(x, y, "router").setOrigin(0.5,1).setScale(PY_ITEM)
            .setTint(0x55555e).setAngle((Math.random()-0.5)*30));
        }
      }
    }

    animateDump(){
      const apexY = this.apexY(this.pyBefore);
      const n = this.carried;
      if (n === 0){ this.finishDump(); return; }
      let landed = 0;
      for (let i = 0; i < n; i++){
        const img = this.add.image(this.aliceX + (Math.random()-0.5)*18, this.alice.y - 30, "router")
          .setOrigin(0.5,1).setScale(PY_ITEM).setTint(0x4a4a52).setDepth(4);
        const tx = this.pyBaseX + (Math.random()-0.5)*46;
        const ty = apexY - Math.random()*8;
        this.tweens.add({
          targets: img, x: tx, y: ty, angle: (Math.random()-0.5)*60,
          delay: i*70, duration: 460, ease: "Quad.easeIn",
          onComplete: () => {
            img.destroy();
            landed++;
            this.cnt.setText("🗿 " + (this.pyBefore + landed));
            this.blipDrop();
            if (landed === n) this.finishDump();
          }
        });
      }
    }

    finishDump(){
      const total = this.pyBefore + this.carried;
      savePyramid(total);
      this.drawPyramid(total);
      this.cnt.setText("🗿 " + total);
      const W = this.scale.gameSize.width;
      this.add.text(W/2, this.scale.gameSize.height*0.5, "тап — назад в коридор",
        {fontFamily:"sans-serif", fontSize:"18px", color:"#3a2c14", backgroundColor:"rgba(233,208,138,0.6)", padding:{x:10,y:6}})
        .setOrigin(0.5).setDepth(6);
      this.canReturn = true;
    }

    returnToCorridor(){
      if (this._returning) return; this._returning = true;
      this.canReturn = false;
      this.cameras.main.fadeOut(400, 0, 0, 0);
      this.cameras.main.once("camerafadeoutcomplete", () => {
        this.scene.resume("corridor");
        this.scene.stop();
      });
    }

    // заметный плакат-баннер вверху
    drawBanner(cx, cy, text){
      const t = this.add.text(0, 0, text, {
        fontFamily:"Arial, 'Helvetica Neue', sans-serif", fontStyle:"bold",
        fontSize:"34px", color:"#241a0e", letterSpacing: 2
      }).setOrigin(0.5);
      const w = Math.ceil(t.width) + 44, h = Math.ceil(t.height) + 26;
      const g = this.add.container(cx, cy).setDepth(6);
      const frame = this.add.rectangle(0, 0, w+10, h+10, 0x2a2018, 0.9).setOrigin(0.5);
      const sheet = this.add.rectangle(0, 0, w, h, 0xf2e4bf, 1).setOrigin(0.5).setStrokeStyle(3, 0x2a2018, 0.7);
      const bar   = this.add.rectangle(0, -h/2 + 7, w, 10, 0xc0392b, 1).setOrigin(0.5);
      // «гвозди»/подвес
      const nailL = this.add.circle(-w/2 + 14, -h/2 + 14, 3, 0x2a2018, 1);
      const nailR = this.add.circle(w/2 - 14, -h/2 + 14, 3, 0x2a2018, 1);
      g.add([frame, sheet, bar, nailL, nailR, t]);
      g.setAngle(-1.2);
      return g;
    }

    // --- декор ---
    drawRuin(x, gY){
      const g = this.add.graphics().setDepth(1);
      g.fillStyle(0x9c7c48, 1);
      g.fillRect(x, gY-70, 40, 70);
      g.fillStyle(0x8a6a3a, 1);
      g.fillRect(x+40, gY-46, 26, 46);
      g.fillStyle(0x7a5c30, 1);
      for (let i=0;i<4;i++) g.fillRect(x+4+i*9, gY-78+((i%2)*6), 7, 10);   // зубцы сверху
    }
    drawTree(x, gY){
      const g = this.add.graphics().setDepth(1);
      g.lineStyle(6, 0x5a4326, 1);
      g.beginPath(); g.moveTo(x, gY); g.lineTo(x, gY-120); g.strokePath();
      g.lineStyle(4, 0x5a4326, 1);
      g.beginPath(); g.moveTo(x, gY-90); g.lineTo(x+34, gY-120); g.strokePath();
      g.beginPath(); g.moveTo(x, gY-70); g.lineTo(x-30, gY-96); g.strokePath();
      g.beginPath(); g.moveTo(x, gY-104); g.lineTo(x-18, gY-138); g.strokePath();
    }
    drawCrow(x, y){
      const g = this.add.graphics().setDepth(2);
      g.lineStyle(2, 0x1c1c1c, 1);
      g.beginPath(); g.moveTo(-8,0); g.lineTo(0,-5); g.lineTo(8,0); g.strokePath();
      g.setPosition(x, y);
      this.tweens.add({ targets:g, x:x+40, duration:2600+Math.random()*1500, yoyo:true, repeat:-1, ease:"Sine.easeInOut" });
    }
    blipDrop(){
      try{
        const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
        if(!this._ac) this._ac = new AC(); const ac=this._ac; if(ac.state==="suspended") ac.resume();
        const o=ac.createOscillator(), g=ac.createGain();
        o.type="triangle"; o.frequency.setValueAtTime(180+Math.random()*60, ac.currentTime);
        o.frequency.exponentialRampToValueAtTime(80, ac.currentTime+0.12);
        g.gain.setValueAtTime(0.05, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+0.14);
        o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+0.15);
      }catch(e){}
    }
  }

  // Кумулятивная пирамида роутеров — сохраняется в рамках сессии (вкладки)
  const PYRAMID_KEY = "apotheosis_pyramid";
  function loadPyramid(){
    try{ return parseInt(sessionStorage.getItem(PYRAMID_KEY), 10) || 0; }catch(e){ return 0; }
  }
  function savePyramid(n){
    try{ sessionStorage.setItem(PYRAMID_KEY, String(n)); }catch(e){}
  }

  // детерминированный ГПСЧ, чтобы перестроенный коридор был стабильным
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  const config = {
    type: Phaser.AUTO,
    parent: "game",
    backgroundColor: "#0e1116",
    scale: {
      mode: Phaser.Scale.RESIZE,   // канвас на весь экран телефона (портрет/ландшафт)
      width: "100%",
      height: "100%",
    },
    physics: {
      default: "arcade",
      arcade: { gravity: { y: 1500 }, debug: false },
    },
    scene: [Corridor, Apotheosis],
  };

  window.game = new Phaser.Game(config);
